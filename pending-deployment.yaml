apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-demo
  namespace: sre-lab-003

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pending-demo

  template:
    metadata:
      labels:
        app: pending-demo

    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10